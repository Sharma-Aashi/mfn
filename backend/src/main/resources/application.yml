spring:
  application:
    name: vitalora-api

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    # DB_URL wins if set directly; otherwise it's composed from the individual
    # host/port/name parts, which is what lets a PaaS blueprint (Render, etc.)
    # auto-wire a managed Postgres instance's separate connection fields.
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:vitalora}}
    username: ${DB_USERNAME:vitalora}
    password: ${DB_PASSWORD:vitalora}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
        globally_quoted_identifiers: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 25MB

server:
  # Render (and most PaaS providers) inject PORT at runtime; SERVER_PORT stays available
  # for anyone self-hosting who wants explicit control.
  port: ${PORT:${SERVER_PORT:8080}}
  error:
    include-message: always
    include-binding-errors: always

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-change-me-vitalora-super-secret-signing-key-min-256-bits-long}
    expiration-ms: ${JWT_EXPIRATION_MS:604800000} # 7 days
  cors:
    allowed-origins: ${APP_CORS_ORIGINS:http://localhost:4200}
  upload:
    dir: ${APP_UPLOAD_DIR:uploads}
    public-path: /uploads
  admin:
    seed-email: ${ADMIN_DEFAULT_EMAIL:admin@vitalora.com}
    seed-password: ${ADMIN_DEFAULT_PASSWORD:Vitalora@Admin123}
  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:4200}
  inventory:
    default-low-stock-threshold: 15

logging:
  level:
    root: INFO
    com.vitalora.api: DEBUG
    org.hibernate.SQL: WARN
